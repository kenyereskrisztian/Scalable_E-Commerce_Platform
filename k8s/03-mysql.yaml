        updated_at  DATETIME(6)   NOT NULL,
        PRIMARY KEY (id),
        KEY idx_products_category (category_id),
        CONSTRAINT fk_products_category FOREIGN KEY (category_id) REFERENCES ecommerce_products.categories (id)
