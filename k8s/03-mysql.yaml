    CREATE TABLE IF NOT EXISTS ecommerce_products.products (
        id          BIGINT        NOT NULL AUTO_INCREMENT,
        name        VARCHAR(255)  NOT NULL,
        description TEXT,
        price       DECIMAL(38,2) NOT NULL,
        stock       INT           NOT NULL,
        image_url   VARCHAR(255),
        sku         VARCHAR(255),
