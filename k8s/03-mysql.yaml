    CREATE TABLE IF NOT EXISTS ecommerce_cart.cart_items (
        id         BIGINT      NOT NULL AUTO_INCREMENT,
        user_id    BIGINT      NOT NULL,
        product_id BIGINT      NOT NULL,
        quantity   INT         NOT NULL,
        created_at DATETIME(6) NOT NULL,
        updated_at DATETIME(6) NOT NULL,
        PRIMARY KEY (id),
        UNIQUE KEY uk_cart_user_product (user_id, product_id)
    ) ENGINE=InnoDB;

    DELETE FROM ecommerce_cart.cart_items;
    INSERT INTO ecommerce_cart.cart_items (id, user_id, product_id, quantity, created_at, updated_at) VALUES
    (1, 1, 1, 1, NOW(6), NOW(6)),
