    SET NAMES utf8mb4;

    CREATE DATABASE IF NOT EXISTS ecommerce_users    CHARACTER SET utf8mb4 COLLATE utf8mb4_hungarian_ci;
    CREATE DATABASE IF NOT EXISTS ecommerce_products CHARACTER SET utf8mb4 COLLATE utf8mb4_hungarian_ci;
    CREATE DATABASE IF NOT EXISTS ecommerce_cart     CHARACTER SET utf8mb4 COLLATE utf8mb4_hungarian_ci;
    CREATE DATABASE IF NOT EXISTS ecommerce_orders   CHARACTER SET utf8mb4 COLLATE utf8mb4_hungarian_ci;

    CREATE TABLE IF NOT EXISTS ecommerce_users.users (
        id           BIGINT       NOT NULL AUTO_INCREMENT,
        email        VARCHAR(255) NOT NULL,
        password     VARCHAR(255) NOT NULL,
        first_name   VARCHAR(255) NOT NULL,
        last_name    VARCHAR(255) NOT NULL,
        phone_number VARCHAR(255),
        address      VARCHAR(255),
        city         VARCHAR(255),
        state        VARCHAR(255),
        zip_code     VARCHAR(255),
        active       BIT(1)       NOT NULL,
        created_at   DATETIME(6)  NOT NULL,
        updated_at   DATETIME(6)  NOT NULL,
        PRIMARY KEY (id),
        UNIQUE KEY uk_users_email (email)
    ) ENGINE=InnoDB;

    DELETE FROM ecommerce_users.users;
