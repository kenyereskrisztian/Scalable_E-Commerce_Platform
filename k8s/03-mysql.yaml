    CREATE TABLE IF NOT EXISTS ecommerce_orders.orders (
        id                BIGINT        NOT NULL AUTO_INCREMENT,
        user_id           BIGINT        NOT NULL,
        status            VARCHAR(255)  NOT NULL,
        total_amount      DECIMAL(38,2) NOT NULL,
        shipping_address  VARCHAR(255),
        shipping_city     VARCHAR(255),
        shipping_state    VARCHAR(255),
        shipping_zip_code VARCHAR(255),
        notes             VARCHAR(255),
        created_at        DATETIME(6)   NOT NULL,
        updated_at        DATETIME(6)   NOT NULL,
        PRIMARY KEY (id),
        KEY idx_orders_user (user_id)
    ) ENGINE=InnoDB;

    CREATE TABLE IF NOT EXISTS ecommerce_orders.order_items (
        id          BIGINT        NOT NULL AUTO_INCREMENT,
        order_id    BIGINT        NOT NULL,
        product_id  BIGINT        NOT NULL,
        quantity    INT           NOT NULL,
        unit_price  DECIMAL(38,2) NOT NULL,
        total_price DECIMAL(38,2) NOT NULL,
        created_at  DATETIME(6)   NOT NULL,
        PRIMARY KEY (id),
        KEY idx_order_items_order (order_id),
        CONSTRAINT fk_order_items_order FOREIGN KEY (order_id) REFERENCES ecommerce_orders.orders (id)
    ) ENGINE=InnoDB;

