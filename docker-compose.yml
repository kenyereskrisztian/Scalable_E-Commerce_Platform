services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test1234}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  frontend-service:
    image: ghcr.io/kenyereskrisztian/frontend-service:latest
    ports:
      - "5500:5500"
    environment:
      API_BASE_URL: http://${PUBLIC_IP:-localhost}:8080
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped
  discovery-service:
    image: ghcr.io/kenyereskrisztian/discovery-service:latest
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    restart: unless-stopped

  user-service:
    image: ghcr.io/kenyereskrisztian/user-service:latest
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DB_NAME: ecommerce_users
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test1234}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_URL: logstash:5000
    restart: unless-stopped

  product-service:
    image: ghcr.io/kenyereskrisztian/product-service:latest
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DB_NAME: ecommerce_products
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test1234}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_URL: logstash:5000
    restart: unless-stopped

  cart-service:
    image: ghcr.io/kenyereskrisztian/cart-service:latest
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DB_NAME: ecommerce_cart
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test1234}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  order-service:
    image: ghcr.io/kenyereskrisztian/order-service:latest
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DB_NAME: ecommerce_orders
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test1234}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_URL: logstash:5000
    restart: unless-stopped

  payment-service:
    image: ghcr.io/kenyereskrisztian/payment-service:latest
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      discovery-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_URL: logstash:5000
    restart: unless-stopped

  notification-service:
    image: ghcr.io/kenyereskrisztian/notification-service:latest
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      discovery-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_URL: logstash:5000
    restart: unless-stopped

  api-gateway:
    image: ghcr.io/kenyereskrisztian/api-gateway:latest
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_URL: logstash:5000
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    profiles: ["elk"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    profiles: ["elk"]
    volumes:
      - ./scripts/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    depends_on:
      - elasticsearch
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    profiles: ["elk"]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    ports:
      - "127.0.0.1:5601:5601"
    restart: unless-stopped

volumes:
  mysql-data:
  es-data:
