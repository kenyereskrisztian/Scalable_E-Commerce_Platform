spring:
  application:
    name: cart-service

server:
  port: 8083

spring.datasource:
  url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${DB_NAME:ecommerce_cart}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  username: ${MYSQL_USER:root}
  password: ${MYSQL_PASSWORD:test1234}
  driver-class-name: com.mysql.cj.jdbc.Driver

spring.jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:NOvxdE/9L4Mn4dKRSzIcGNnHjf3gdtdTopmti0n7Dy4=}
    expiration: 86400000

eureka:
  instance:
    prefer-ip-address: true
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
