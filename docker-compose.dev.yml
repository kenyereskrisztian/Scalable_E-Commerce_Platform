services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test1234}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptest1234"]
      interval: 10s
      timeout: 5s
      retries: 20
  frontend-service:
    build:
      context: .
      dockerfile: frontend-service/Dockerfile
    ports:
      - "5500:5500"
    depends_on:
      api-gateway:
        condition: service_started
  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    ports:
      - "8761:8761"

  user-service:
    image: maven:3.9-eclipse-temurin-17
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: sh -c "mvn -B -pl common install -DskipTests && mvn -B -pl user-service spring-boot:run -Dspring-boot.run.jvmArguments='-Xms128m -Xmx256m'"
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DB_NAME: ecommerce_users
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test1234}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_URL: logstash:5000

  product-service:
    image: maven:3.9-eclipse-temurin-17
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: sh -c "mvn -B -pl common install -DskipTests && mvn -B -pl product-service spring-boot:run -Dspring-boot.run.jvmArguments='-Xms128m -Xmx256m'"
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DB_NAME: ecommerce_products
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test1234}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_URL: logstash:5000

  cart-service:
    image: maven:3.9-eclipse-temurin-17
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: sh -c "mvn -B -pl common install -DskipTests && mvn -B -pl cart-service spring-boot:run -Dspring-boot.run.jvmArguments='-Xms128m -Xmx256m'"
    ports:
      - "8083:8083"
    depends_on:
      db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DB_NAME: ecommerce_cart
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test1234}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}

  order-service:
    image: maven:3.9-eclipse-temurin-17
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: sh -c "mvn -B -pl common install -DskipTests && mvn -B -pl order-service spring-boot:run -Dspring-boot.run.jvmArguments='-Xms128m -Xmx256m'"
    ports:
      - "8084:8084"
    depends_on:
      db:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DB_NAME: ecommerce_orders
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test1234}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_URL: logstash:5000

  payment-service:
    image: maven:3.9-eclipse-temurin-17
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: sh -c "mvn -B -pl common install -DskipTests && mvn -B -pl payment-service spring-boot:run -Dspring-boot.run.jvmArguments='-Xms128m -Xmx256m'"
    ports:
      - "8085:8085"
    depends_on:
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_URL: logstash:5000

  notification-service:
    image: maven:3.9-eclipse-temurin-17
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: sh -c "mvn -B -pl common install -DskipTests && mvn -B -pl notification-service spring-boot:run -Dspring-boot.run.jvmArguments='-Xms128m -Xmx256m'"
    ports:
      - "8086:8086"
    depends_on:
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}

  api-gateway:
    image: maven:3.9-eclipse-temurin-17
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: sh -c "mvn -B -pl common install -DskipTests && mvn -B -pl api-gateway spring-boot:run -Dspring-boot.run.jvmArguments='-Xms128m -Xmx256m'"
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_URL: logstash:5000
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    volumes:
      - ./scripts/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    depends_on:
      - elasticsearch
    ports:
      - "5000:5000"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"

volumes:
  mysql-data:
  es-data:
